<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Läxförhör Hälsa v41 – Öva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12263f;
    --blue:#1d4e89;
    --ball:#e8590c;
    --ball-soft:#fff0e6;
    --ok:#2b8a3e;
    --ok-soft:#e6f4ea;
    --bg:#eef1f5;
    --card:#ffffff;
    --ink:#17202b;
    --muted:#5b6675;
    --line:#d5dbe3;
    --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
    --body:"Atkinson Hyperlegible","Segoe UI",Verdana,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--body);font-size:18px;line-height:1.5;
    padding-bottom:max(24px,env(safe-area-inset-bottom));
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 16px}

  /* Scoreboard header */
  header.board{
    background:var(--navy);color:#fff;
    padding:max(14px,env(safe-area-inset-top)) 0 16px;
    border-bottom:6px solid var(--ball);
  }
  .board .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
  .board h1{
    font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:0;letter-spacing:.01em;
  }
  .board .sub{font-size:15px;opacity:.8;margin-top:4px}
  .score{
    background:#0b1829;border:2px solid #2c4568;border-radius:10px;
    padding:6px 14px;text-align:center;min-width:92px;
  }
  .score b{display:block;font-family:var(--display);font-size:38px;line-height:1;color:#ffb27a}
  .score span{font-size:13px;opacity:.8}
  .score.bump b{animation:bump .35s ease-out}
  @keyframes bump{40%{transform:scale(1.25)}}

  .dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .dot{
    width:24px;height:24px;border-radius:50%;border:2px solid #5f7a9d;
    display:grid;place-items:center;font-size:11px;font-weight:700;color:#9fb3cf;
    background:transparent;
  }
  .dot.known{background:var(--ok);border-color:var(--ok);color:#fff}
  .dot.tricky{background:var(--ball);border-color:var(--ball);color:#fff}

  main{padding-top:20px}
  h2{font-family:var(--display);font-size:30px;line-height:1.05;margin:0 0 8px;font-weight:800}
  p{margin:0 0 12px}
  .muted{color:var(--muted)}

  .card{
    background:var(--card);border:2px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;
  }

  button{
    font:inherit;font-weight:700;cursor:pointer;border-radius:12px;border:2px solid transparent;
    padding:14px 18px;min-height:52px;width:100%;text-align:left;
  }
  button:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .primary{background:var(--ball);color:#fff}
  .primary:active{transform:translateY(1px)}
  .secondary{background:#fff;color:var(--navy);border-color:var(--navy)}
  .quiet{background:transparent;color:var(--blue);border-color:var(--line);text-align:center}
  button[disabled]{opacity:.45;cursor:not-allowed}
  .stack{display:grid;gap:10px}
  .btn-sub{display:block;font-weight:400;font-size:15px;opacity:.9}

  /* Question */
  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:15px;margin-bottom:10px}
  .bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
  .bar i{display:block;height:100%;background:var(--ball);transition:width .25s}
  .q{font-size:24px;line-height:1.3;font-weight:700;margin:0 0 6px}
  .page{font-size:15px;color:var(--muted);margin-bottom:14px}
  textarea{
    width:100%;min-height:84px;font:inherit;padding:12px;border-radius:10px;border:2px solid var(--line);
    resize:vertical;margin-bottom:12px;
  }
  .hint{background:var(--ball-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:16px}

  .answer{border-left:6px solid var(--ok);background:var(--ok-soft);border-radius:10px;padding:14px 16px;margin:6px 0 16px}
  .answer .short{font-weight:700;font-size:20px;margin-bottom:6px}
  .answer ul{margin:6px 0 0;padding-left:20px}
  .answer li{margin-bottom:4px}
  .answer svg{display:block;margin:10px auto 0;max-width:260px;width:100%;height:auto}
  .grade{display:grid;gap:10px}
  .g-yes{background:var(--ok);color:#fff}
  .g-almost{background:#fff;color:var(--navy);border-color:var(--navy)}
  .g-no{background:#fff;color:#a3320a;border-color:#e8590c}

  .big{font-family:var(--display);font-size:64px;font-weight:800;line-height:1;color:var(--ball)}

  /* Read mode */
  details{background:var(--card);border:2px solid var(--line);border-radius:12px;margin-bottom:10px}
  summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style-position:inside}
  details[open] summary{border-bottom:2px solid var(--line)}
  details .answer{margin:12px;}

  @media (prefers-reduced-motion:reduce){
    .score.bump b{animation:none}
    .bar i{transition:none}
  }
  @media (min-width:600px){
    body{font-size:19px}
    .board h1{font-size:42px}
  }
</style>
</head>
<body>
<header class="board">
  <div class="wrap">
    <div class="row">
      <div>
        <h1>Hälsa v41</h1>
        <div class="sub">Läxförhör i hemkunskap</div>
      </div>
      <div class="score" id="score" aria-live="polite"><b id="scoreNum">0</b><span>poäng</span></div>
    </div>
    <div class="dots" id="dots" aria-label="Framsteg per fråga"></div>
  </div>
</header>

<main class="wrap" id="app"></main>

<script>
/* ---------- Frågor och svar (anpassade för årskurs 6) ---------- */
const PLATE = `
<svg viewBox="0 0 260 260" role="img" aria-label="Tallriksmodellen: hälften grönsaker, en fjärdedel kolhydrater, en fjärdedel protein">
  <circle cx="130" cy="130" r="122" fill="#fff" stroke="#12263f" stroke-width="4"/>
  <path d="M130 130 L130 10 A120 120 0 0 0 130 250 Z" fill="#8fd19e"/>
  <path d="M130 130 L130 10 A120 120 0 0 1 250 130 Z" fill="#f4d35e"/>
  <path d="M130 130 L250 130 A120 120 0 0 1 130 250 Z" fill="#e8895c"/>
  <g stroke="#12263f" stroke-width="3"><line x1="130" y1="10" x2="130" y2="250"/><line x1="130" y1="130" x2="250" y2="130"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#12263f">
    <text x="72" y="105" font-size="16" font-weight="700">½ Grönsaker</text>
    <text x="72" y="126" font-size="12">vitaminer,</text>
    <text x="72" y="141" font-size="12">mineraler, fibrer</text>
    <text x="190" y="72" font-size="14" font-weight="700">¼ Kolhydrater</text>
    <text x="190" y="90" font-size="12">energi</text>
    <text x="190" y="104" font-size="11">potatis, ris, pasta</text>
    <text x="190" y="190" font-size="14" font-weight="700">¼ Protein</text>
    <text x="190" y="208" font-size="12">bygga kroppen</text>
    <text x="190" y="222" font-size="11">fisk, kött, ägg, bönor</text>
  </g>
</svg>`;

const Q = [
 {p:"s.9", q:"Förklara skillnaden mellan bäst före och sista förbrukningsdag.",
  hint:"Ett handlar om kvalitet, det andra om säkerhet.",
  short:"Bäst före = kvalitet. Sista förbrukningsdag = säkerhet.",
  more:["<b>Bäst före:</b> Efter datumet kan maten bli lite sämre (smak, lukt, konsistens), men den är ofta fortfarande ok. Titta, lukta och smaka.",
        "<b>Sista förbrukningsdag:</b> Efter datumet kan maten göra dig sjuk. Då ska den slängas. Står på färskvaror, till exempel färskt kött, fisk och färdigrätter."]},

 {p:"s.12", q:"Vad heter kroppens 6 näringsämnen?",
  hint:"Tre ger energi/bygger kroppen. Tre hjälper kroppen att fungera. Ett av dem dricker du.",
  short:"Kolhydrater, protein, fett, vitaminer, mineraler och vatten.",
  more:["Kolhydrater, protein och fett = ger energi och bygger kroppen.","Vitaminer och mineraler = behövs i små mängder för att kroppen ska fungera.","Vatten = behövs hela tiden."]},

 {p:"s.23–25 (gul bok)", q:"Nämn 3 saker vi bör äta mer av enligt kostråden.",
  hint:"Tänk grönt, havet och fullkorn.",
  short:"Frukt och grönt, fisk och fullkorn.",
  more:["Fler bra svar: baljväxter (bönor, linser), nötter och frön, nyttiga oljor (rapsolja, olivolja).","<i>Kolla gärna s.23–25 så att du använder samma ord som i boken.</i>"]},

 {p:"s.26 (gul bok)", q:"Nämn 3 saker vi bör äta mindre av enligt kostråden.",
  hint:"Sött, salt och charkuterier.",
  short:"Socker (godis, läsk, bakverk), salt (chips, snacks) och rött kött/chark (korv, skinka).",
  more:["Även: mycket fet och fräst snabbmat.","<i>Kolla s.26 så att du använder samma ord som i boken.</i>"]},

 {p:"s.16", q:"Ge ett exempel på mat som innehåller snabba kolhydrater.",
  hint:"Sådant som ger snabb energi, men som man blir hungrig på igen snabbt.",
  short:"Godis, läsk, vitt bröd, kakor, saft.",
  more:["Snabba kolhydrater ger snabb energi men blodsockret går upp och ner snabbt, så man blir hungrig igen."]},

 {p:"s.16", q:"Ge ett exempel på mat som innehåller långsamma kolhydrater.",
  hint:"Mat med mycket fibrer. Du blir mätt längre.",
  short:"Fullkornsbröd, havregrynsgröt, fullkornspasta, bönor, linser, rotfrukter.",
  more:["Långsamma kolhydrater ger energi lite i taget, så man blir mätt längre och orkar koncentrera sig bättre."]},

 {p:"s.20", q:"Varför behöver kroppen näringsämnet protein?",
  hint:"Tänk på vad som händer när du växer och tränar.",
  short:"Protein bygger upp och lagar kroppen.",
  more:["Behövs till muskler, hud, hår, naglar och för att växa.","Extra viktigt när man är barn och växer, och när man tränar (till exempel basket)."]},

 {p:"s.20", q:"Varför behöver kroppen näringsämnet kolhydrater?",
  hint:"Bränsle!",
  short:"Kolhydrater ger energi (bränsle) till hjärnan och musklerna.",
  more:["Hjärnan använder mycket energi, och det är kolhydrater den helst använder."]},

 {p:"s.20", q:"Ge exempel på ett protein från växtriket och ett protein från djurriket.",
  hint:"En böna och en fisk. Vilka fler kan du?",
  short:"Växtriket: bönor, linser, kikärtor, tofu, nötter. Djurriket: kött, fisk, ägg, mjölk, ost.",
  more:["Du behöver bara ett exempel av varje i svaret."]},

 {p:"s.21", q:"Varför är det bra att variera protein från både växtriket och djurriket?",
  hint:"Olika mat innehåller olika saker. Och tänk på miljön.",
  short:"Olika proteinkällor ger olika sorters byggstenar och olika extra näring, så kroppen får allt den behöver.",
  more:["Växtprotein: ger också fibrer och är ofta bättre för miljön.","Djurprotein: ger bland annat järn och B12 (fisk ger också jod och D-vitamin).","<i>Kolla s.21 efter bokens egen förklaring.</i>"]},

 {p:"s.23", q:"Vad betyder MSC-märkningen?",
  hint:"Havet. Fiskarna ska inte ta slut.",
  short:"Fisken eller skaldjuret är fångat på ett hållbart sätt.",
  more:["Det betyder att man inte fiskar för mycket och att fisket skadar havet så lite som möjligt.","MSC står för Marine Stewardship Council."]},

 {p:"s.23", q:"Varför är det bra att äta fisk 2–3 gånger i veckan?",
  hint:"Nyttigt fett, vitaminer och mineraler.",
  short:"Fisk innehåller nyttigt fett (omega-3), D-vitamin och jod, och är bra för hjärtat och hjärnan.",
  more:["Fisk ger också protein.","Fet fisk (lax, sill, makrill) är extra bra."]},

 {p:"s.25", q:"Rita Tallriksmodellens tre delar och skriv in näringsämnena!",
  hint:"Hälften, en fjärdedel och en fjärdedel.",
  short:"½ grönsaker, ¼ kolhydrater (potatis, ris, pasta), ¼ protein (fisk, kött, ägg, bönor).",
  more:["Rita en cirkel, dela den i två halvor och dela sedan ena halvan i två.","Grönsaker ger vitaminer, mineraler och fibrer. Kolhydrater ger energi. Protein bygger kroppen.","<i>Jämför med bilden i boken s.25. Boken kan ha med fett och vatten också.</i>"],
  extra:PLATE},

 {p:"s.26", q:"Vad innebär KRAV-märkningen?",
  hint:"Ekologiskt. Ingen konstgödsel.",
  short:"Maten är ekologiskt odlad, utan konstgjorda bekämpningsmedel och konstgödsel.",
  more:["KRAV har också extra regler för att djuren ska ha det bra och för miljön."]},

 {p:"s.27", q:"Vad innebär Fairtrade?",
  hint:"Rättvist. Länder långt härifrån.",
  short:"Bönder och arbetare, ofta i fattigare länder, får rättvis betalning och bättre arbetsvillkor.",
  more:["Barnarbete är förbjudet.","Vanligt på kaffe, kakao, bananer, te och socker."]},

 {p:"s.27", q:"Vad innebär Nyckelhålet?",
  hint:"Ett hjälpmedel när du handlar. Jämför två liknande produkter.",
  short:"Nyckelhålet visar att maten är ett nyttigare val än liknande produkter.",
  more:["Maten har till exempel mindre socker, salt och mättat fett, och mer fibrer och fullkorn.","Hjälper dig att välja snabbt i affären."]}
];

/* ---------- Tillstånd ---------- */
const KEY = 'camilo-halsa-v41';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || {status:{}, points:0}; }catch(e){ return {status:{}, points:0}; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
let st = load();
let run = null; // {queue, pos, correct, total, requeued:Set, shown:false, streak}

const $ = s => document.querySelector(s);
const app = $('#app');

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return s; } // innehållet är eget och betrott

function renderDots(){
  $('#dots').innerHTML = Q.map((_,i)=>{
    const s = st.status[i];
    return `<span class="dot ${s||''}" title="Fråga ${i+1}">${i+1}</span>`;
  }).join('');
  $('#scoreNum').textContent = st.points;
}

function counts(){
  let known=0,tricky=0;
  Q.forEach((_,i)=>{ if(st.status[i]==='known') known++; else if(st.status[i]==='tricky') tricky++; });
  return {known,tricky,fresh:Q.length-known-tricky};
}

/* ---------- Vyer ---------- */
function home(){
  run = null;
  renderDots();
  const c = counts();
  app.innerHTML = `
    <h2>Dags att träna</h2>
    <p class="muted">${c.known} av ${Q.length} frågor sitter. Börja med en kort runda. Svara högt innan du tittar på svaret.</p>
    <div class="stack">
      <button class="primary" id="b5">Kort runda<span class="btn-sub">5 frågor, tar ungefär 5 minuter</span></button>
      <button class="secondary" id="ball">Alla ${Q.length} frågor<span class="btn-sub">Som ett riktigt förhör</span></button>
      <button class="secondary" id="bhard" ${c.tricky? '':'disabled'}>Bara de svåra<span class="btn-sub">${c.tricky} oranga frågor</span></button>
      <button class="quiet" id="bread">Läs alla svar</button>
      <button class="quiet" id="breset">Börja om från noll</button>
    </div>
    <p class="muted" style="margin-top:18px;font-size:15px">Grön = satt. Orange = behöver tränas mer. Grå = inte övad än. Svaren följer Livsmedelsverkets kostråd, men kolla alltid i boken (sidorna står vid varje fråga).</p>`;
  $('#b5').onclick = ()=> start('short');
  $('#ball').onclick = ()=> start('all');
  $('#bhard').onclick = ()=> start('hard');
  $('#bread').onclick = readAll;
  $('#breset').onclick = ()=>{ if(confirm('Nollställa alla framsteg och poäng?')){ st={status:{},points:0}; save(); home(); } };
}

function start(mode){
  const ids = Q.map((_,i)=>i);
  let queue;
  if(mode==='all') queue = shuffle(ids);
  else if(mode==='hard') queue = shuffle(ids.filter(i=>st.status[i]==='tricky'));
  else {
    const notKnown = shuffle(ids.filter(i=>st.status[i]!=='known'));
    const known = shuffle(ids.filter(i=>st.status[i]==='known'));
    queue = notKnown.concat(known).slice(0,5);
  }
  run = {queue, pos:0, total:queue.length, points:0, requeued:new Set(), shown:false, streak:0, bestStreak:0, satt:0};
  question();
}

function question(){
  if(run.pos >= run.queue.length) return done();
  const i = run.queue[run.pos];
  const it = Q[i];
  const pct = Math.round(run.pos / run.queue.length * 100);
  app.innerHTML = `
    <div class="meta"><span>Fråga ${run.pos+1} av ${run.queue.length}</span><span>${run.streak>1? run.streak+' i rad!':''}</span></div>
    <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
    <div class="card">
      <p class="q">${it.q}</p>
      <div class="page">Boken ${it.p}</div>
      <div id="hintBox"></div>
      <div id="reveal">
        <textarea id="mine" placeholder="Skriv eller säg svaret högt först (valfritt)" aria-label="Ditt svar"></textarea>
        <div class="stack">
          <button class="primary" id="show">Visa svaret</button>
          <button class="quiet" id="hint">Ge mig en ledtråd</button>
        </div>
      </div>
    </div>
    <button class="quiet" id="quit">Avsluta rundan</button>`;
  $('#hint').onclick = ()=>{ $('#hintBox').innerHTML = `<div class="hint"><b>Ledtråd:</b> ${it.hint}</div>`; $('#hint').style.display='none'; };
  $('#show').onclick = ()=> showAnswer(i);
  $('#quit').onclick = home;
}

function showAnswer(i){
  const it = Q[i];
  $('#reveal').innerHTML = `
    <div class="answer">
      <div class="short">${it.short}</div>
      <ul>${it.more.map(m=>`<li>${m}</li>`).join('')}</ul>
      ${it.extra||''}
    </div>
    <p style="font-weight:700;margin-bottom:8px">Hur gick det?</p>
    <div class="grade">
      <button class="g-yes" id="gy">Satt! <span class="btn-sub">Jag kunde svara själv (+2 poäng)</span></button>
      <button class="g-almost" id="ga">Nästan <span class="btn-sub">Jag hade en del rätt (+1 poäng)</span></button>
      <button class="g-no" id="gn">Missade <span class="btn-sub">Jag tar den igen senare</span></button>
    </div>`;
  $('#gy').onclick = ()=> grade(i,'yes');
  $('#ga').onclick = ()=> grade(i,'almost');
  $('#gn').onclick = ()=> grade(i,'no');
  $('#gy').focus({preventScroll:true});
}

function grade(i, g){
  let pts = 0;
  if(g==='yes'){ pts = 2; st.status[i]='known'; run.streak++; run.satt++; run.bestStreak=Math.max(run.bestStreak,run.streak); }
  else if(g==='almost'){ pts = 1; st.status[i]='tricky'; run.streak=0; }
  else { st.status[i]='tricky'; run.streak=0; }
  st.points += pts; run.points += pts;
  if(g!=='yes' && !run.requeued.has(i)){ run.requeued.add(i); run.queue.push(i); }
  save();
  renderDots();
  if(pts){ const s=$('#score'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
  run.pos++;
  question();
}

function done(){
  const pct = run.satt / run.total;
  const msg = pct>=0.8 ? 'Riktigt bra jobbat!' : pct>=0.5 ? 'Bra, du är på god väg.' : 'Bra att du tränade. Det är så man lär sig.';
  app.innerHTML = `
    <div class="card" style="text-align:center">
      <div class="big">+${run.points}</div>
      <p style="font-weight:700;font-size:22px;margin:6px 0">${msg}</p>
      <p class="muted">Du satte ${run.satt} av ${run.total} frågor. Längsta serie: ${run.bestStreak}.</p>
    </div>
    <div class="stack">
      <button class="primary" id="again">Ny kort runda</button>
      <button class="secondary" id="home">Till startsidan</button>
    </div>`;
  $('#again').onclick = ()=> start('short');
  $('#home').onclick = home;
}

function readAll(){
  app.innerHTML = `
    <h2>Alla svar</h2>
    <p class="muted">Tryck på en fråga för att se svaret.</p>
    ${Q.map((it,i)=>`
      <details>
        <summary>${i+1}. ${it.q} <span class="muted">(${it.p})</span></summary>
        <div class="answer"><div class="short">${it.short}</div>
        <ul>${it.more.map(m=>`<li>${m}</li>`).join('')}</ul>${it.extra||''}</div>
      </details>`).join('')}
    <button class="secondary" id="home" style="margin-top:6px">Tillbaka</button>`;
  $('#home').onclick = home;
}

home();
</script>
</body>
</html>
